<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Resume Screener</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1d2330;--mu:#6b7280;--ac:#4f46e5;--ok:#16a34a;--bad:#dc2626;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#181c2e;--tx:#e8eaf3;--mu:#98a0b5;--bd:#2a3050}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:20px;background:var(--ac);color:#fff}h1{margin:0;font-size:1.4rem}header p{margin:4px 0 0;opacity:.85;font-size:.9rem}
main{max-width:1000px;margin:auto;padding:16px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
h2{margin:0 0 10px;font-size:1.05rem}textarea,input[type=text]{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:130px;resize:vertical}button{background:var(--ac);color:#fff;border:0;padding:10px 18px;border-radius:8px;font:inherit;cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;margin:2px;border:1px solid var(--bd)}
.ok{color:var(--ok);border-color:var(--ok)}.bad{color:var(--bad);border-color:var(--bad)}
.item{border-top:1px solid var(--bd);padding:12px 0}.top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.bar{height:8px;background:var(--bd);border-radius:6px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.mu{color:var(--mu);font-size:.85rem}
</style></head><body>
<header style="text-align: center;"><h1>AI Resume Screening &amp; Candidate Ranking</h1><p>Java + NLP (TF-IDF, Naive Bayes)</p></header>
<main>
<div class="card"><h2>1. Job Description</h2><textarea id="jd" placeholder="Paste the job description here...">We need a Java developer with Spring Boot, Hibernate, MySQL, REST API, Git and Maven experience. Knowledge of microservices and Docker is a plus.</textarea></div>
<div class="card"><h2>2. Add Resumes</h2>
<input type="file" id="files" multiple accept=".txt"> <span class="mu">(.txt files)</span>
<div class="row"><input type="text" id="nm" placeholder="Candidate name" style="max-width:220px"></div>
<div class="row"><textarea id="tx" placeholder="...or paste resume text here"></textarea></div>
<div class="row"><button class="sec" id="add">+ Add pasted resume</button><button id="go">Rank Candidates</button><button class="sec" id="clr">Clear</button></div>
<p class="mu" id="cnt">0 resumes added</p></div>
<div class="card" id="out" hidden><h2>Results</h2><div id="meta" class="mu"></div><div id="list"></div></div>
</main>
<script>
const c=[],$=i=>document.getElementById(i);
const upd=()=>$('cnt').textContent=c.length+' resumes added: '+c.map(x=>x.name).join(', ');
const el=(t,cls,txt)=>{const e=document.createElement(t);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
$('files').onchange=async e=>{for(const f of e.target.files)c.push({name:f.name.replace(/\.[^.]+$/,''),text:await f.text()});e.target.value='';upd()};
$('add').onclick=()=>{if(!$('tx').value.trim())return;c.push({name:$('nm').value.trim()||'Candidate '+(c.length+1),text:$('tx').value});$('tx').value='';$('nm').value='';upd()};
$('clr').onclick=()=>{c.length=0;upd();$('out').hidden=true};
$('go').onclick=async()=>{
  if(!$('jd').value.trim()||!c.length)return alert('Add a job description and at least one resume');
  const clean=s=>s.replace(/[\u0001\u0002]/g,'');
  const body=clean($('jd').value)+c.map(x=>'\u0001'+clean(x.name)+'\u0002'+clean(x.text)).join('');
  const r=await (await fetch('/api/rank',{method:'POST',body})).json();
  $('out').hidden=false;
  $('meta').textContent='Predicted job category: '+r.category+' ('+(r.confidence*100).toFixed(1)+'% confidence) | Skills required: '+(r.jdSkills.join(', ')||'none detected');
  const L=$('list');L.innerHTML='';
  r.results.forEach((x,i)=>{
    const d=el('div','item'),t=el('div','top');
    t.append(el('span',null,'#'+(i+1)+'  '+x.name),el('span',null,(x.score*100).toFixed(1)+'%'));
    const b=el('div','bar'),f=el('i');f.style.width=Math.min(100,x.score*100)+'%';b.append(f);
    d.append(t,b,el('div','mu','Text similarity '+(x.cosine*100).toFixed(0)+'%  |  Skill match '+(x.skill*100).toFixed(0)+'%  |  Role fit (ML) '+(x.cls*100).toFixed(0)+'%'));
    const g=el('div');x.matched.forEach(s=>g.append(el('span','tag ok','✓ '+s)));x.missing.forEach(s=>g.append(el('span','tag bad','✗ '+s)));
    d.append(g);L.append(d)});
};
</script></body></html>
